<h1>Cadastro</h1>

{% if erros %}
    {% for erro in erros %}
        <p style="color:red;">{{ erro }}</p>
    {% endfor %}
{% endif %}

<form method="POST">

    {% csrf_token %}

    Nome:
    <input type="text" name="nome">
    <br><br>

    E-mail:
    <input type="text" name="email">
    <br><br>

    Data de Nascimento:
    <input type="date" name="data_nascimento">
    <br><br>

    <button type="submit">
        Cadastrar
    </button>

</form>
